name: Appwrite Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC) to keep Appwrite from auto-pausing
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  heartbeat:
    name: Ping Appwrite Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Heartbeat to Appwrite API
        run: |
          echo "Sending keep-alive heartbeat to Appwrite Project: 6a9131260006737c5919..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            "https://sgp.cloud.appwrite.io/v1/databases/talent_pool_db/collections/talents/documents" \
            -H "X-Appwrite-Project: 6a9131260006737c5919" \
            -H "Content-Type: application/json")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Keep-alive successful! Appwrite project is ACTIVE and awake."
          elif [ "$HTTP_STATUS" -eq 403 ]; then
            echo "⚠️ Appwrite returned 403. Check if project requires manual console restore."
            echo "$HTTP_BODY"
            exit 1
          else
            echo "ℹ️ Response received with status $HTTP_STATUS"
            echo "$HTTP_BODY"
          fi
